# Private repos on the free GitHub plan cannot protect tags with rulesets, so every pushed v* tag is verified here
# and removed again unless it was published by lumio/bin/release.sh after all regression tests passed.
# Identical copy in every Lumio repo; lumio/bin/test.sh checks that the copies match.
name: Release guard

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  checks: read
  statuses: read

jobs:
  guard:
    name: Release guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          bash .github/scripts/verify-release.sh
      - name: Remove unverified tag
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}"
